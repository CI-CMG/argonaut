name: project change

on:
  workflow_call:
  workflow_dispatch:
  workflow_run:
    types:
      - completed
      - requested
      - in_progress
  status:
  watch:
    types:
      - started
  discussion:
    types:
      - created
      - edited
      - deleted
      - transferred
      - pinned
      - unpinned
      - labeled
      - unlabeled
      - locked
      - unlocked
      - category_changed
      - answered
      - unanswered
  discussion_comment:
    types:
      - created
      - edited
      - deleted
  issue_comment:
#    types:
#      - created
#      - edited
#      - deleted
  issues:
    types:
      - opened
      - edited
      - deleted
      - transferred
      - pinned
      - unpinned
      - closed
      - reopened
      - assigned
      - unassigned
      - labeled
      - unlabeled
      - locked
      - unlocked
      - milestoned
      - demilestoned
      - typed
      - untyped

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - run: echo "event name is:" ${{ github.event_name }}
      - run: echo "event type is:" ${{ github.event.action }}